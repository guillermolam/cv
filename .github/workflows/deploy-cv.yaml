name: Deploy CV Site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimal workflow-level permissions — each job scopes its own needs
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source and content
        run: |
          pnpm exec astro sync
          pnpm exec astro check --minimumFailingSeverity warning
          pnpm deps:forbidden
          pnpm motion:validate
          pnpm layout:validate
          pnpm data-display:validate
          pnpm retro:validate
          pnpm charts:validate
          pnpm content:validate
          pnpm test
          pnpm format:check

      - name: Build and validate production routes
        run: |
          pnpm exec playwright install --with-deps
          pnpm test:e2e
          test -d dist
          test -f dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # Scoped here — build job doesn't need these
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
